services:
  relay:
    # Replace the upstream all-interface publication with exactly one explicit
    # loopback/Tailscale binding. !reset would clear the list and discard this
    # replacement value; !override is required here.
    ports: !override
      - "${BUZZ_BIND_IP:?set BUZZ_BIND_IP}:${BUZZ_HTTP_PORT:-3000}:3000"
  pairing-proxy:
    # Only the path-restricting proxy is exposed to the private network. The
    # stateless pairing relay remains internal to the Compose network.
    ports: !override
      - "${BUZZ_BIND_IP:?set BUZZ_BIND_IP}:${BUZZ_PAIRING_PORT:-5000}:8080"
  tls-ingress:
    # Tailscale Serve only supports loopback HTTP reverse-proxy targets. This
    # port is not reachable from the LAN or tailnet directly.
    ports: !override
      - "127.0.0.1:${BUZZ_TLS_BACKEND_PORT:-13000}:8080"
