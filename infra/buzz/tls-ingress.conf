worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;
  limit_conn_zone $binary_remote_addr zone=pairing_per_ip:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 130s;
    keepalive_timeout 15s;
    # Preserve the relay's reviewed 500 MiB video ceiling; narrower proxy
    # defaults would silently break otherwise-valid mobile media uploads.
    client_max_body_size 500m;

    location = /_health {
      access_log off;
      return 204;
    }

    location = /pair {
      limit_except GET { deny all; }
      if ($http_upgrade !~* ^websocket$) { return 426; }
      limit_conn pairing_per_ip 4;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_connect_timeout 3s;
      proxy_send_timeout 10s;
      proxy_read_timeout 130s;
      proxy_buffering off;
      proxy_pass http://pairing-relay:5000;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 3s;
      proxy_send_timeout 130s;
      proxy_read_timeout 130s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_pass http://relay:3000;
    }
  }
}
